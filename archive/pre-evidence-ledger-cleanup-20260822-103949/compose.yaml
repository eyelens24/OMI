services:
  quant-doctor:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    read_only: true
    volumes:
      - quant_doctor_data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  quant_doctor_data:
